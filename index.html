<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapPages</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Animated Small Bottom Nav */
        .bottom-nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); width: 220px; transition: 0.3s; }
        .dark-mode .bottom-nav { background: rgba(30,30,30,0.9); border-color: #374151; }
        .nav-btn.active { color: #3b82f6; transform: scale(1.1); }
        
        /* Image Slider */
        .img-slider { scroll-snap-type: x mandatory; overflow-x: auto; scrollbar-width: none; }
        .img-slider::-webkit-scrollbar { display: none; }
        .img-snap { scroll-snap-align: center; }

        /* Bottom Sheet Modals */
        .bottom-sheet { transform: translateY(100%); transition: transform 0.3s ease-in-out; }
        .bottom-sheet.open { transform: translateY(0); }
        .blur-bg { backdrop-filter: blur(8px); background: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 pb-20 font-sans transition-colors">

    <!-- Header -->
    <header class="p-4 bg-white/90 backdrop-blur-md sticky top-0 z-10 font-bold text-lg flex justify-between shadow-sm">
        <span id="headerTitle">SnapPages</span>
    </header>

    <!-- MAIN TABS -->
    <main id="tab-home" class="p-4 max-w-lg mx-auto space-y-4 fade-in">
        <div id="feed" class="space-y-4"><div class="text-center text-gray-400 py-10"><i class="fas fa-spinner fa-spin text-3xl"></i></div></div>
        <button onclick="openModal('postModal')" class="fixed bottom-20 right-4 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl z-40 hover:scale-105"><i class="fas fa-plus"></i></button>
    </main>

    <main id="tab-settings" class="hidden p-4 max-w-lg mx-auto space-y-4 fade-in">
        <!-- Settings Menu -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <button onclick="loadMyPosts()" class="w-full text-left p-4 border-b flex items-center justify-between hover:bg-gray-50">
                <span><i class="fas fa-layer-group w-6 text-blue-500"></i> My Posts</span>
            </button>
            <button onclick="openModal('channelModal')" class="w-full text-left p-4 border-b flex items-center justify-between hover:bg-gray-50">
                <span><i class="fas fa-robot w-6 text-purple-500"></i> Set Auto Post Channels</span>
            </button>
            <button onclick="copyRefer()" class="w-full text-left p-4 border-b flex items-center justify-between hover:bg-gray-50">
                <span><i class="fas fa-link w-6 text-green-500"></i> Refer Link</span>
            </button>
            <a href="https://t.me/+GyFgfeJIub81MDg9" target="_blank" class="block w-full p-4 hover:bg-gray-50 text-blue-600 font-bold">
                <i class="fas fa-headset w-6"></i> Support
            </a>
        </div>
    </main>

    <!-- SMALL ANIMATED BOTTOM NAV -->
    <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bottom-nav shadow-2xl rounded-full flex justify-between items-center px-6 py-3 z-40 border border-gray-200">
        <button onclick="switchTab('home')" class="nav-btn active text-gray-400 transition" id="nav-home"><i class="fas fa-home text-2xl"></i></button>
        <button onclick="switchTab('search')" class="nav-btn text-gray-400 transition"><i class="fas fa-search text-2xl"></i></button>
        <button onclick="switchTab('settings')" class="nav-btn text-gray-400 transition" id="nav-settings">
            <img id="navProfilePic" src="https://ui-avatars.com/api/?name=U" class="w-8 h-8 rounded-full border-2 border-transparent object-cover">
        </button>
    </nav>

    <!-- ================= MODALS & BOTTOM SHEETS ================= -->

    <!-- CREATE POST (Multi Image) -->
    <div id="postModal" class="hidden fixed inset-0 blur-bg z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Create Post</h3><button onclick="closeModal('postModal')"><i class="fas fa-times"></i></button></div>
            <textarea id="postText" class="w-full bg-gray-50 rounded-xl p-3 h-24 mb-3 outline-none" placeholder="What's on your mind?"></textarea>
            
            <input type="file" id="imageUpload" accept="image/*" multiple class="hidden">
            <button onclick="document.getElementById('imageUpload').click()" class="text-blue-500 border border-blue-500 px-4 py-2 rounded-full text-sm mb-3"><i class="fas fa-image"></i> Add Photos (Max 4)</button>
            
            <div id="imgPreviewContainer" class="flex gap-2 overflow-x-auto mb-3"></div>
            <button id="submitPostBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Post</button>
        </div>
    </div>

    <!-- COMMENTS BOTTOM SHEET -->
    <div id="commentModalBg" class="hidden fixed inset-0 blur-bg z-50 flex items-end">
        <div id="commentSheet" class="bg-white w-full rounded-t-3xl p-5 bottom-sheet h-[70vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2"><h3 class="font-bold">Comments</h3><button onclick="closeComment()"><i class="fas fa-times text-xl"></i></button></div>
            <div id="commentList" class="flex-1 overflow-y-auto space-y-3 mb-3"></div>
            <div class="flex gap-2">
                <input type="text" id="commentInput" class="flex-1 bg-gray-100 rounded-full px-4 py-2 outline-none" placeholder="Write a comment...">
                <button id="sendCommentBtn" class="bg-blue-600 text-white w-10 h-10 rounded-full"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- MY POSTS MODAL -->
    <div id="myPostsModal" class="hidden fixed inset-0 bg-white z-50 flex flex-col">
        <div class="p-4 shadow-sm flex items-center gap-4 bg-white"><button onclick="closeModal('myPostsModal')"><i class="fas fa-arrow-left text-xl"></i></button><h2 class="font-bold text-lg">My Posts</h2></div>
        <div id="myPostsList" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"></div>
    </div>

    <!-- SETUP CHANNEL MODAL -->
    <div id="channelModalBg" class="hidden fixed inset-0 blur-bg z-50 flex items-end">
        <div id="channelSheet" class="bg-white w-full rounded-t-3xl p-5 bottom-sheet h-[70vh] flex flex-col">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Auto Post Channels</h3><button onclick="closeSheet('channelModalBg', 'channelSheet')"><i class="fas fa-times"></i></button></div>
            <p class="text-xs text-red-500 mb-3">* Bot must be an Admin in the channel!</p>
            <div class="flex gap-2 mb-4">
                <input type="text" id="channelInput" class="flex-1 bg-gray-100 rounded-lg px-3 py-2 outline-none text-sm" placeholder="Channel username or link">
                <button id="setupChannelBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">SetUp</button>
            </div>
            <div id="channelList" class="flex-1 overflow-y-auto space-y-2"></div>
        </div>
    </div>

    <!-- IMAGE LIGHTBOX -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black/95 z-[60] flex items-center justify-center">
        <button onclick="closeModal('lightbox')" class="absolute top-5 right-5 text-white text-3xl"><i class="fas fa-times"></i></button>
        <img id="lightboxImg" class="max-w-full max-h-full object-contain">
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient('https://znecyxkatbuzgnvcwitm.supabase.co', 'sb_publishable_9sYA9S0ph32WedvLdRtyEA_gxjkz8L2'); // ⚠️ Update this!
        
        const tg = window.Telegram.WebApp;
        let currentUser = null;
        let imagesArray = [];
        let currentPostIdForComment = null;

        tg.expand();
        if(tg.colorScheme === 'dark') document.body.classList.add('bg-gray-900', 'text-white', 'dark-mode');

        // Auth & Get Profile Data
        async function initApp() {
            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ initData: tg.initData }) });
            const data = await res.json();
            currentUser = data.user;
            document.getElementById('navProfilePic').src = currentUser.photo_url || `https://ui-avatars.com/api/?name=${currentUser.name}`;
            loadPosts();
        }

        // Navigation
        window.switchTab = (tab) => {
            ['home', 'settings'].forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active', 'text-blue-600'));
            const activeBtn = document.getElementById(`nav-${tab}`);
            if(activeBtn) activeBtn.classList.add('active', 'text-blue-600');
            
            if(tab === 'settings') document.getElementById('navProfilePic').classList.add('border-blue-600');
            else document.getElementById('navProfilePic').classList.remove('border-blue-600');
        };

        // UI Helpers
        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.closeSheet = (bg, sheet) => {
            document.getElementById(sheet).classList.remove('open');
            setTimeout(() => document.getElementById(bg).classList.add('hidden'), 300);
        }
        window.openLightbox = (src) => { document.getElementById('lightboxImg').src = src; openModal('lightbox'); }

        // Multi Image Upload Logic
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (imagesArray.length + files.length > 4) return tg.showAlert("Maximum 4 images allowed!");
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    imagesArray.push(ev.target.result);
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
        });

        function renderPreviews() {
            const c = document.getElementById('imgPreviewContainer');
            c.innerHTML = '';
            imagesArray.forEach((src, idx) => {
                c.innerHTML += `<div class="relative min-w-[80px] h-20 rounded-lg overflow-hidden border">
                    <img src="${src}" class="w-full h-full object-cover">
                    <button onclick="removeImg(${idx})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
                </div>`;
            });
        }
        window.removeImg = (idx) => { imagesArray.splice(idx, 1); renderPreviews(); }

        // Create Post
        document.getElementById('submitPostBtn').addEventListener('click', async () => {
            const text = document.getElementById('postText').value;
            if(!text && imagesArray.length===0) return;
            const btn = document.getElementById('submitPostBtn');
            btn.innerText = "Posting..."; btn.disabled = true;

            await fetch('/api/createPost', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, text, imagesBase64: imagesArray }) });
            
            closeModal('postModal');
            document.getElementById('postText').value = '';
            imagesArray = []; renderPreviews();
            btn.innerText = "Post"; btn.disabled = false;
            loadPosts();
        });

        // Load Feed
        async function loadPosts() {
            const { data: posts } = await supabase.from('posts').select('*').order('created_at', { ascending: false }).limit(30);
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            posts.forEach(async post => {
                // Determine Author Photo
                let authPhoto = 'https://ui-avatars.com/api/?name=' + post.author_name;
                if(post.type === 'user') {
                    const { data: u } = await supabase.from('users').select('photo_url').eq('tg_id', post.author_id).single();
                    if(u?.photo_url) authPhoto = u.photo_url;
                } else {
                    const { data: u } = await supabase.from('users').select('channels').contains('channels', [{id: post.author_id}]);
                    if(u && u.length > 0) {
                        const ch = u[0].channels.find(c => c.id === post.author_id);
                        if(ch && ch.photo) authPhoto = ch.photo;
                    }
                }

                // Render Image Slider
                let imgHtml = '';
                if(post.image_urls && post.image_urls.length > 0) {
                    imgHtml = `<div class="flex img-slider gap-1 mb-3 rounded-lg">`;
                    post.image_urls.forEach(url => {
                        imgHtml += `<img src="${url}" onclick="openLightbox('${url}')" class="img-snap w-full max-h-72 object-cover flex-shrink-0 cursor-pointer">`;
                    });
                    imgHtml += `</div>`;
                    if(post.image_urls.length > 1) imgHtml += `<p class="text-center text-xs text-gray-400 mb-2">Swipe for more images <i class="fas fa-exchange-alt"></i></p>`;
                }

                feed.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border ${document.body.classList.contains('dark-mode') ? 'bg-gray-800 border-gray-700' : ''}">
                        <div class="flex items-center space-x-3 mb-3 cursor-pointer" onclick="tg.openTelegramLink('${post.type==='channel' ? 'https://t.me/c/'+post.author_id.replace('-100','') : 'tg://user?id='+post.author_id}')">
                            <img src="${authPhoto}" class="w-10 h-10 rounded-full object-cover">
                            <h3 class="font-bold text-sm">${post.author_name}</h3>
                        </div>
                        <p class="mb-3 text-sm whitespace-pre-wrap">${post.text}</p>
                        ${imgHtml}
                        <div class="flex justify-between text-gray-500 text-sm pt-3 border-t">
                            <button class="hover:text-red-500"><i class="fas fa-heart"></i></button>
                            <button onclick="openComments('${post.id}')" class="hover:text-blue-500"><i class="fas fa-comment"></i> Comment</button>
                            <button onclick="tg.openTelegramLink('https://t.me/share/url?url=${encodeURIComponent('https://t.me/SnapPagesBot/app?startapp=post_'+post.id)}')" class="hover:text-green-500"><i class="fas fa-share"></i> Share</button>
                        </div>
                    </div>`;
            });
        }

        // ================= Comments Logic =================
        window.openComments = async (postId) => {
            currentPostIdForComment = postId;
            document.getElementById('commentModalBg').classList.remove('hidden');
            setTimeout(() => document.getElementById('commentSheet').classList.add('open'), 10);
            fetchComments();
        }
        window.closeComment = () => closeSheet('commentModalBg', 'commentSheet');

        async function fetchComments() {
            const list = document.getElementById('commentList');
            list.innerHTML = '<p class="text-center text-gray-400 text-sm">Loading...</p>';
            const res = await fetch('/api/getComments', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ postId: currentPostIdForComment }) });
            const comments = await res.json();
            list.innerHTML = '';
            comments.forEach(c => {
                const isMine = c.author_id === currentUser.tg_id;
                list.innerHTML += `<div class="bg-gray-50 p-3 rounded-lg text-sm relative">
                    <span class="font-bold">${c.author_name}</span>: ${c.text}
                    ${isMine ? `<button onclick="delComment('${c.id}')" class="absolute top-2 right-2 text-red-400"><i class="fas fa-trash"></i></button>` : ''}
                </div>`;
            });
        }

        document.getElementById('sendCommentBtn').onclick = async () => {
            const text = document.getElementById('commentInput').value;
            if(!text) return;
            await fetch('/api/addComment', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, postId: currentPostIdForComment, text }) });
            document.getElementById('commentInput').value = '';
            fetchComments();
        };

        window.delComment = async (id) => {
            await fetch('/api/deleteComment', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, commentId: id }) });
            fetchComments();
        }

        // ================= My Posts =================
        window.loadMyPosts = async () => {
            openModal('myPostsModal');
            const list = document.getElementById('myPostsList');
            list.innerHTML = 'Loading...';
            const { data } = await supabase.from('posts').select('*').eq('author_id', currentUser.tg_id).order('created_at', {ascending: false});
            list.innerHTML = '';
            data.forEach(p => {
                list.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border mb-2 flex justify-between items-center">
                    <p class="truncate w-3/4 text-sm">${p.text || 'Photo Post'}</p>
                    <button onclick="deletePost('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        };
        window.deletePost = async (id) => {
            if(confirm("Delete post?")) {
                await fetch('/api/deletePost', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, postId: id }) });
                loadMyPosts(); loadPosts();
            }
        };

        // ================= Channel Setup =================
        document.querySelector('[onclick="openModal(\'channelModal\')"]').onclick = () => {
            document.getElementById('channelModalBg').classList.remove('hidden');
            setTimeout(() => document.getElementById('channelSheet').classList.add('open'), 10);
            renderChannels();
        };

        function renderChannels() {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            (currentUser.channels || []).forEach(c => {
                list.innerHTML += `<div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border">
                    <div class="flex items-center gap-2"><img src="${c.photo}" class="w-8 h-8 rounded-full"> <span class="font-bold text-sm">${c.name}</span></div>
                    <button onclick="removeChannel('${c.id}')" class="text-red-500 bg-red-100 p-2 rounded-full"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }

        document.getElementById('setupChannelBtn').onclick = async () => {
            const input = document.getElementById('channelInput').value;
            if(!input) return;
            const btn = document.getElementById('setupChannelBtn');
            btn.innerText = "...";
            const res = await fetch('/api/addChannel', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, channelInput: input }) });
            const data = await res.json();
            btn.innerText = "SetUp";
            if(data.error) tg.showAlert(data.error);
            else { currentUser.channels = data.channels; renderChannels(); document.getElementById('channelInput').value=''; }
        };

        window.removeChannel = async (id) => {
            const res = await fetch('/api/removeChannel', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, channelId: id }) });
            const data = await res.json();
            currentUser.channels = data.channels; renderChannels();
        };

        // Extra
        window.copyRefer = () => {
            navigator.clipboard.writeText(`https://t.me/SnapPagesBot/app?startapp=ref_${currentUser.tg_id}`);
            tg.showAlert("Referral link copied!");
        };

        initApp();
    </script>
</body>
</html>
