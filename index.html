<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        /* Smooth Fade In */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Deep link Highlight */
        .highlight-post { border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); transition: 1s; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 pb-20 fade-in">

    <!-- Search Header -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-md p-4 shadow-sm z-40 flex items-center gap-3">
        <input type="text" id="searchInput" placeholder="Search posts..." class="w-full bg-gray-100 rounded-full px-4 py-2 outline-none border border-transparent focus:border-blue-500 transition">
    </header>

    <!-- Main Feed -->
    <main id="feed" class="p-4 max-w-lg mx-auto space-y-4"></main>

    <!-- Create Post FAB -->
    <button onclick="document.getElementById('postModal').classList.remove('hidden')" class="fixed bottom-24 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl z-40 hover:scale-105 transition"><i class="fas fa-plus"></i></button>

    <!-- Bottom Capsule Nav -->
    <nav class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-xl shadow-xl rounded-full flex gap-8 px-8 py-3 z-50 border border-gray-200">
        <button class="text-blue-600"><i class="fas fa-home text-xl"></i></button>
        <button class="text-gray-400 hover:text-blue-500"><i class="fas fa-user-circle text-xl"></i></button>
        <button class="text-gray-400 hover:text-blue-500"><i class="fas fa-cog text-xl"></i></button>
    </nav>

    <!-- Scripts -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient('https://znecyxkatbuzgnvcwitm.supabase.co', 'sb_publishable_9sYA9S0ph32WedvLdRtyEA_gxjkz8L2');
        
        const tg = window.Telegram.WebApp;
        
        // 1. Full Screen Mode Integration
        tg.ready();
        try {
            if (tg.requestFullscreen) tg.requestFullscreen(); // New API
            else tg.expand(); // Fallback
        } catch (e) { tg.expand(); }

        // 2. Dynamic Theme
        const applyTheme = () => {
            const isDark = tg.colorScheme === 'dark';
            document.body.className = isDark ? 'bg-gray-900 text-white pb-20' : 'bg-gray-50 text-gray-900 pb-20';
            document.querySelector('header').className = isDark ? 'sticky top-0 bg-gray-900/90 backdrop-blur-md p-4 shadow-sm z-40 flex items-center gap-3 border-b border-gray-800' : 'sticky top-0 bg-white/90 backdrop-blur-md p-4 shadow-sm z-40 flex items-center gap-3';
            document.querySelector('nav').className = isDark ? 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur-xl shadow-xl rounded-full flex gap-8 px-8 py-3 z-50 border border-gray-700' : 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-xl shadow-xl rounded-full flex gap-8 px-8 py-3 z-50 border border-gray-200';
        };
        applyTheme();
        tg.onEvent('themeChanged', applyTheme);

        // 3. Backend Verification & Auto Welcome Call
        let currentUserData = null;
        async function authenticate() {
            const res = await fetch('YOUR_RENDER_URL/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            const data = await res.json();
            currentUserData = data.user;
        }

        // 4. Feed Render & Deep Linking logic
        async function loadPosts(searchQuery = '') {
            const feed = document.getElementById('feed');
            let query = supabase.from('posts').select('*').order('created_at', { ascending: false }).limit(20);
            
            if (searchQuery) query = query.ilike('text', `%${searchQuery}%`);
            
            const { data: posts } = await query;
            feed.innerHTML = '';

            posts.forEach(async post => {
                // UI Level Badge Logic
                let badge = post.type === 'channel' ? `<span class="bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded ml-2">Channel</span>` : '';
                if (post.type === 'user') {
                    const { data: u } = await supabase.from('users').select('level').eq('tg_id', post.author_id).single();
                    if (u?.level === 5) badge = `<span class="text-blue-500 ml-1 text-sm"><i class="fas fa-check-circle"></i></span>`;
                }

                const postEl = document.createElement('div');
                postEl.className = `p-4 rounded-xl shadow-sm border ${tg.colorScheme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`;
                postEl.id = `post_${post.id}`;

                postEl.innerHTML = `
                    <div class="flex items-center space-x-3 mb-3 cursor-pointer" onclick="tg.openTelegramLink('tg://user?id=${post.author_id}')">
                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">${post.author_name.charAt(0)}</div>
                        <div>
                            <h3 class="font-bold flex items-center">${post.author_name} ${badge}</h3>
                        </div>
                    </div>
                    <p class="mb-3 whitespace-pre-wrap text-sm">${post.text}</p>
                    ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg mb-3 object-cover">` : ''}
                    
                    <div class="flex justify-between items-center text-gray-500 text-sm border-t ${tg.colorScheme === 'dark' ? 'border-gray-700' : ''} pt-3 mt-2">
                        <button class="hover:text-red-500"><i class="fas fa-heart"></i> ${post.likes.length}</button>
                        <button class="hover:text-blue-500"><i class="fas fa-comment"></i></button>
                        <button class="hover:text-green-500"><i class="fas fa-share"></i></button>
                        <button class="hover:text-blue-500 font-bold"><i class="fas fa-user-plus"></i> Follow</button>
                    </div>
                `;
                feed.appendChild(postEl);
            });

            // Deep Link Handler (startapp=post_12345)
            const startParam = tg.initDataUnsafe?.start_param;
            if (startParam && startParam.startsWith('post_') && !searchQuery) {
                setTimeout(() => {
                    const target = document.getElementById(startParam);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.classList.add('highlight-post');
                        setTimeout(() => target.classList.remove('highlight-post'), 2000);
                    }
                }, 1000); // Wait for render
            }
        }

        // Search Listener
        document.getElementById('searchInput').addEventListener('input', (e) => {
            loadPosts(e.target.value);
        });

        // Initialize App
        authenticate().then(() => loadPosts());
    </script>
</body>
</html>
