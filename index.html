<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bottom-nav { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); }
        .dark-mode .bottom-nav { background: rgba(30,30,30,0.85); border-color: #374151; }
        .highlight-post { border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); transition: 1s; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300 pb-24 font-sans">

    <!-- Top Header -->
    <header class="p-4 bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-10 font-bold text-lg flex justify-between items-center transition-colors" id="headerContainer">
        <span id="headerTitle">Home</span>
        <!-- Search bar (Only shows in Search Tab) -->
        <input type="text" id="searchInput" class="hidden w-2/3 p-2 bg-gray-100 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500" placeholder="Search posts...">
    </header>

    <!-- ================= TABS ================= -->
    
    <!-- 1. HOME TAB -->
    <main id="tab-home" class="tab-content p-4 space-y-4 max-w-lg mx-auto">
        <div id="feed" class="space-y-4">
            <div class="text-center text-gray-400 py-10"><i class="fas fa-spinner fa-spin text-3xl"></i><p class="mt-2 text-sm">Loading amazing posts...</p></div>
        </div>
        
        <!-- FAB Create Post Button -->
        <button id="openPostBtn" class="fixed bottom-24 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl z-40 hover:scale-105 transition">
            <i class="fas fa-pen"></i>
        </button>
    </main>

    <!-- 2. SEARCH TAB -->
    <main id="tab-search" class="tab-content hidden p-4 max-w-lg mx-auto space-y-4">
        <div id="searchFeed" class="space-y-4"></div>
    </main>

    <!-- 3. SETTINGS TAB -->
    <main id="tab-settings" class="tab-content hidden p-4 max-w-lg mx-auto space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm flex items-center space-x-4 mb-2 transition-colors">
            <div id="setProfilePic" class="w-16 h-16 bg-blue-500 text-white rounded-full flex items-center justify-center text-3xl font-bold">U</div>
            <div>
                <h2 class="font-bold text-xl" id="setUserName">Loading...</h2>
                <p class="text-sm text-gray-500" id="setLevel">Level: 1 | <i class="fas fa-users"></i> <span id="setReferrals">0</span></p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm overflow-hidden transition-colors">
            <button class="w-full text-left p-4 border-b flex items-center justify-between hover:bg-gray-50">
                <span><i class="fas fa-layer-group w-6 text-blue-500"></i> My Posts</span>
            </button>
            <button id="referBtn" class="w-full text-left p-4 border-b flex items-center justify-between hover:bg-gray-50">
                <span><i class="fas fa-link w-6 text-green-500"></i> Copy Referral Link</span>
            </button>
            <div class="p-4 border-b flex items-center justify-between">
                <span><i class="fas fa-bell w-6 text-yellow-500"></i> Notifications</span>
                <input type="checkbox" id="notifToggle" checked class="w-5 h-5 accent-blue-500">
            </div>
            <a href="https://t.me/telegram" target="_blank" class="block w-full text-left p-4 flex items-center justify-between hover:bg-gray-50 text-blue-500 font-bold">
                <span><i class="fas fa-headset w-6"></i> Support</span>
            </a>
        </div>
    </main>

    <!-- ================= CAPSULE BOTTOM NAV ================= -->
    <nav class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bottom-nav shadow-[0_10px_40px_rgba(0,0,0,0.1)] rounded-full flex justify-around items-center p-2 z-50 border border-gray-200">
        <button onclick="switchTab('home')" class="p-3 text-gray-500 hover:text-blue-600 transition w-16 text-center text-blue-600" id="nav-home"><i class="fas fa-home text-2xl"></i></button>
        <button onclick="switchTab('search')" class="p-3 text-gray-500 hover:text-blue-600 transition w-16 text-center" id="nav-search"><i class="fas fa-search text-2xl"></i></button>
        <button onclick="switchTab('settings')" class="p-3 text-gray-500 hover:text-blue-600 transition w-16 text-center" id="nav-settings"><i class="fas fa-user text-2xl"></i></button>
    </nav>

    <!-- ================= CREATE POST MODAL ================= -->
    <div id="postModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end justify-center p-2 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-t-2xl p-5 mb-0 transform transition-transform transition-colors">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Create New Post</h3>
                <button onclick="document.getElementById('postModal').classList.add('hidden')"><i class="fas fa-times text-gray-500 text-xl"></i></button>
            </div>
            <textarea id="postText" class="w-full bg-gray-50 rounded-xl p-3 h-28 mb-3 outline-none resize-none border border-gray-200 focus:border-blue-500 transition-colors" placeholder="What's on your mind?"></textarea>
            
            <input type="file" id="imageUpload" accept="image/*" class="hidden">
            <button onclick="document.getElementById('imageUpload').click()" class="border border-blue-500 text-blue-500 px-4 py-2 rounded-full text-sm mb-4 flex items-center hover:bg-blue-50 transition"><i class="fas fa-image mr-2"></i> Add Photo</button>
            
            <img id="previewImg" class="hidden w-full h-40 object-cover rounded-lg mb-4 border shadow-sm">

            <button id="submitPostBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg">Post Now</button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // ⚠️ আপনার Supabase URL ও Key এখানে অবশ্যই বসাবেন
        const SUPABASE_URL = 'https://znecyxkatbuzgnvcwitm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9sYA9S0ph32WedvLdRtyEA_gxjkz8L2';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const tg = window.Telegram.WebApp;
        let currentUser = null;
        let base64Image = null;

        // 1. Initialize & Full Screen
        tg.ready();
        try { if(tg.requestFullscreen) tg.requestFullscreen(); else tg.expand(); } catch(e) { tg.expand(); }

        // 2. Dynamic Theme Engine
        const applyTheme = () => {
            const isDark = tg.colorScheme === 'dark';
            if (isDark) {
                document.body.classList.add('bg-gray-900', 'text-white', 'dark-mode');
                document.body.classList.remove('bg-gray-100', 'text-gray-900');
                document.querySelectorAll('.bg-white, .bg-gray-50').forEach(el => { el.classList.add('bg-gray-800', 'border-gray-700'); el.classList.remove('bg-white', 'bg-gray-50'); });
            } else {
                document.body.classList.remove('bg-gray-900', 'text-white', 'dark-mode');
                document.body.classList.add('bg-gray-100', 'text-gray-900');
                // Removed dynamic light reset for simplicity, rely on Tailwind defaults
            }
        };
        applyTheme();
        tg.onEvent('themeChanged', applyTheme);

        // 3. Tab Navigation Logic
        window.switchTab = (tab) => {
            ['home', 'search', 'settings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-blue-600');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('text-blue-600');
            
            const header = document.getElementById('headerTitle');
            const searchInput = document.getElementById('searchInput');
            
            if(tab === 'search') {
                header.classList.add('hidden');
                searchInput.classList.remove('hidden');
            } else {
                header.classList.remove('hidden');
                searchInput.classList.add('hidden');
                header.innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            }
        };

        // 4. Authenticate via Backend API
        async function authenticate() {
            try {
                // এখানে সরাসরি /api/auth কল করা হয়েছে (যেহেতু একই সার্ভারে হোস্ট করা)
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    // Update Settings UI
                    document.getElementById('setUserName').innerText = currentUser.name;
                    document.getElementById('setProfilePic').innerText = currentUser.name.charAt(0);
                    document.getElementById('setLevel').innerHTML = `Level: ${currentUser.level || 1} | <i class="fas fa-users"></i> ${currentUser.refer_count || 0}`;
                    document.getElementById('notifToggle').checked = currentUser.push_notif !== false;
                } else {
                    tg.showAlert("Authentication Failed! Please open from Telegram.");
                }
            } catch (err) {
                console.error("Auth Error:", err);
            }
        }

        // 5. Fetch and Render Posts
        async function loadPosts(queryText = '') {
            const feed = document.getElementById(queryText ? 'searchFeed' : 'feed');
            
            let query = supabase.from('posts').select('*').order('created_at', { ascending: false }).limit(20);
            if (queryText) query = query.ilike('text', `%${queryText}%`);
            
            const { data: posts, error } = await query;
            if (error) { feed.innerHTML = '<p class="text-center text-red-500">Error loading posts!</p>'; return; }

            feed.innerHTML = '';
            
            if (posts.length === 0) {
                feed.innerHTML = '<p class="text-center text-gray-400 py-10">No posts found.</p>';
                return;
            }

            for(let post of posts) {
                const likesCount = post.likes ? post.likes.length : 0;
                const isLiked = post.likes && post.likes.includes(currentUser?.tg_id?.toString() || currentUser?.id?.toString());
                
                let badge = post.type === 'channel' ? `<span class="bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded ml-2">Channel</span>` : '';
                
                // Fetch User Level for Blue Badge
                if (post.type === 'user') {
                    const { data: u } = await supabase.from('users').select('level').eq('tg_id', post.author_id).single();
                    if (u?.level === 5) badge = `<span class="text-blue-500 ml-1 text-sm"><i class="fas fa-check-circle"></i></span>`;
                }

                const postEl = document.createElement('div');
                postEl.className = `p-4 rounded-xl shadow-sm border mb-4 ${tg.colorScheme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`;
                postEl.id = `post_${post.id}`;

                postEl.innerHTML = `
                    <div class="flex items-center space-x-3 mb-3 cursor-pointer" onclick="tg.openTelegramLink('tg://user?id=${post.author_id}')">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg">${post.author_name.charAt(0)}</div>
                        <div>
                            <h3 class="font-bold flex items-center text-sm">${post.author_name} ${badge}</h3>
                            <p class="text-xs text-gray-400">Just now</p>
                        </div>
                    </div>
                    <p class="mb-3 whitespace-pre-wrap text-sm">${post.text}</p>
                    ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg mb-3 object-cover max-h-64 border">` : ''}
                    
                    <div class="flex justify-between items-center text-gray-500 text-sm border-t ${tg.colorScheme === 'dark' ? 'border-gray-700' : 'border-gray-100'} pt-3 mt-2">
                        <button onclick="interact('${post.id}', 'like', '${post.author_id}')" class="flex items-center gap-1 hover:text-red-500 transition ${isLiked ? 'text-red-500' : ''}">
                            <i class="fas fa-heart"></i> <span id="like_${post.id}">${likesCount}</span>
                        </button>
                        <button class="flex items-center gap-1 hover:text-blue-500 transition"><i class="fas fa-comment"></i></button>
                        <button class="flex items-center gap-1 hover:text-green-500 transition"><i class="fas fa-share"></i></button>
                        <button class="flex items-center gap-1 hover:text-blue-500 font-bold transition"><i class="fas fa-user-plus"></i> Follow</button>
                    </div>
                `;
                feed.appendChild(postEl);
            }

            // Deep Linking Handler (Scrolls to post if opened from Notification)
            const startParam = tg.initDataUnsafe?.start_param;
            if (startParam && startParam.startsWith('post_') && !queryText) {
                setTimeout(() => {
                    const target = document.getElementById(startParam);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.classList.add('highlight-post');
                        setTimeout(() => target.classList.remove('highlight-post'), 2500);
                    }
                }, 800);
            }
        }

        // 6. Like Action API
        window.interact = async (postId, action, authorId) => {
            try {
                // UI Instant Update
                const likeIcon = document.querySelector(`#like_${postId}`).previousElementSibling;
                const likeCountSpan = document.getElementById(`like_${postId}`);
                let currentCount = parseInt(likeCountSpan.innerText);

                if(likeIcon.classList.contains('text-red-500')) {
                    likeIcon.classList.remove('text-red-500');
                    likeCountSpan.innerText = currentCount - 1;
                } else {
                    likeIcon.classList.add('text-red-500');
                    likeCountSpan.innerText = currentCount + 1;
                }

                // Backend Request
                await fetch('/api/interact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData, postId, action, targetUserId: authorId })
                });
            } catch (err) {
                console.error("Action Error", err);
            }
        };

        // 7. Image Upload Logic (Base64)
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    base64Image = event.target.result;
                    document.getElementById('previewImg').src = base64Image;
                    document.getElementById('previewImg').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 8. Create Post Call
        document.getElementById('openPostBtn').onclick = () => document.getElementById('postModal').classList.remove('hidden');
        
        document.getElementById('submitPostBtn').addEventListener('click', async () => {
            const text = document.getElementById('postText').value;
            if(!text && !base64Image) return tg.showAlert("Please write something or upload a photo!");
            
            const btn = document.getElementById('submitPostBtn');
            btn.innerText = "Posting..."; 
            btn.disabled = true;

            try {
                const res = await fetch('/api/createPost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData, text, imageBase64: base64Image })
                });
                
                const data = await res.json();
                if (data.error) {
                    tg.showAlert("Error: " + data.error);
                } else {
                    document.getElementById('postModal').classList.add('hidden');
                    document.getElementById('postText').value = '';
                    document.getElementById('previewImg').classList.add('hidden');
                    base64Image = null;
                    loadPosts(); // Reload feed
                }
            } catch (err) {
                tg.showAlert("Network Error! Please try again.");
            }
            
            btn.innerText = "Post Now"; 
            btn.disabled = false;
        });

        // 9. Extra Features (Search, Referral, Settings)
        document.getElementById('searchInput').addEventListener('input', (e) => loadPosts(e.target.value));

        document.getElementById('notifToggle').addEventListener('change', (e) => {
            fetch('/api/updateSettings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData, push_notif: e.target.checked })
            });
        });

        document.getElementById('referBtn').onclick = () => {
            const botUsername = "SnapPagesBot"; // ⚠️ আপনার টেলিগ্রাম বটের ইউজারনেম এখানে দিন
            const id = currentUser?.tg_id || currentUser?.id;
            const link = `https://t.me/${botUsername}?start=${id}`;
            navigator.clipboard.writeText(link).then(() => tg.showAlert("Referral Link Copied!"));
        };

        // App Initializer Start
        authenticate().then(() => loadPosts());

    </script>
</body>
</html>
