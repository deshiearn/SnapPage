<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</head>
<body class="transition-colors duration-300">
    <!-- Navbar -->
    <nav class="p-4 flex justify-between items-center border-b">
        <h1 class="font-bold text-xl" id="greeting">Hello!</h1>
        <button id="settingsBtn" class="p-2 bg-gray-200 rounded-full">⚙️ Settings</button>
    </nav>

    <!-- Main Feed -->
    <div id="feed" class="p-4 pb-20 space-y-4">
        <!-- Posts will render here -->
    </div>

    <!-- Create Post FAB -->
    <button id="createPostBtn" class="fixed bottom-6 right-6 bg-blue-500 text-white p-4 rounded-full shadow-lg">
        + Post
    </button>
</body>
</html>
